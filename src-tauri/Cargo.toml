[package]
name = "typst-presenter"
version = "0.2.0"
description = "Dual-window presentation console with speaker notes and pacing timers for Typst and arbitrary PDFs"
authors = ["tokotoko9981"]
license = "MIT"
repository = "https://github.com/tokotoko9981/typst-presenter"
edition = "2021"

[lib]
name = "typst_presenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
