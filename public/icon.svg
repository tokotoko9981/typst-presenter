<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="timer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="96" stroke="#334155" stroke-width="6" />

  <!-- Main Slide Canvas (16:9 ratio in center) -->
  <rect x="76" y="110" width="360" height="225" rx="16" fill="#1e293b" stroke="#475569" stroke-width="8" />

  <!-- Slide Header bar -->
  <rect x="108" y="145" width="180" height="18" rx="9" fill="url(#accent)" />

  <!-- Slide Content lines -->
  <rect x="108" y="185" width="280" height="12" rx="6" fill="#94a3b8" />
  <rect x="108" y="215" width="230" height="12" rx="6" fill="#64748b" />
  <rect x="108" y="245" width="160" height="12" rx="6" fill="#64748b" />

  <!-- Dual-Screen Presenter split indicator (handheld / secondary monitor) -->
  <!-- Note / Timer console bar below slide -->
  <rect x="76" y="360" width="220" height="56" rx="12" fill="#0f172a" stroke="#334155" stroke-width="4" />
  <!-- Notes indicator lines -->
  <rect x="96" y="380" width="120" height="8" rx="4" fill="#cbd5e1" />
  <rect x="96" y="396" width="80" height="6" rx="3" fill="#64748b" />

  <!-- Timer badge -->
  <rect x="316" y="360" width="120" height="56" rx="12" fill="#0f172a" stroke="url(#timer)" stroke-width="4" />
  <circle cx="342" cy="388" r="10" stroke="url(#timer)" stroke-width="4" fill="none" />
  <line x1="342" y1="388" x2="342" y2="382" stroke="url(#timer)" stroke-width="3" stroke-linecap="round" />
  <line x1="342" y1="388" x2="348" y2="388" stroke="url(#timer)" stroke-width="3" stroke-linecap="round" />
  <rect x="362" y="382" width="54" height="12" rx="4" fill="url(#timer)" />

  <!-- Laser pointer / Spotlight glow accent dot -->
  <circle cx="380" cy="180" r="12" fill="#ef4444" />
  <circle cx="380" cy="180" r="24" fill="#ef4444" opacity="0.35" />
</svg>
